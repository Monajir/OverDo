<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OverDO</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>

<body>
    <div class="auth-container">
        <!-- Left Panel: Promotional -->
        <div class="auth-panel promotional orange">
            <div class="brand-logo float-anim">
                <div class="brand-icon">⚡</div>
                <h1 class="brand-name">OverDO</h1>
            </div>
            <p class="tagline">Where productivity meets personality. Get stuff done with a character that actually cares
                (maybe too much).</p>

            <div class="flex gap-4" style="margin-top: 2rem;">
                <span
                    style="background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; font-size: 0.9rem;">🎯
                    Tasks</span>
                <span
                    style="background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; font-size: 0.9rem;">🍅
                    Pomodoro</span>
                <span
                    style="background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; font-size: 0.9rem;">🏆
                    Ranks</span>
            </div>
        </div>

        <!-- Right Panel: Login Form -->
        <div class="auth-panel">
            <div class="auth-form-container">
                <div class="auth-header">
                    <h2 class="auth-title">Welcome back!</h2>
                    <p class="auth-subtitle">Ready to be judged for your productivity?</p>
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <label class="input-label" for="email">Email</label>
                        <input type="email" id="email" name="email" class="input-field" placeholder="you@example.com"
                            required>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="password">Password</label>
                        <div style="position: relative;">
                            <input type="password" id="password" name="password" class="input-field"
                                placeholder="........" required>
                            <span class="material-icons-round"
                                style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer;">visibility_off</span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-full">Sign in</button>

                    <p class="text-center" style="margin-top: 1.5rem; color: var(--text-muted);">
                        Don't have an account? <a href="signup.html" class="link">Create one</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</body>
<script>
    document.getElementById("loginForm").addEventListener("submit", async e => {
        e.preventDefault();

        const email = e.target.email.value;
        const password = e.target.password.value;

        try {
            const res = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const contentType = res.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
                const data = await res.json();
                if (!res.ok) {
                    alert(data.message || data.error || "Login failed");
                } else {
                    localStorage.setItem("token", data.token);
                    window.location.href = "/dashboard.html";
                }
            } else {
                const text = await res.text();
                console.error("Non-JSON response:", text);
                alert("Server error. Please try again later.");
            }
        } catch (err) {
            console.error("Fetch error:", err);
            alert("Network error or server is down.");
        }
    });


    // Password visibility toggle
    document.querySelector(".material-icons-round").addEventListener("click", () => {
        const input = document.getElementById("password");
        input.type = input.type === "password" ? "text" : "password";
    });


</script>

</html>
